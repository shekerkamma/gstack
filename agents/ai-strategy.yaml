interface:
  display_name: "ai-strategy"
  short_description: "AI business strategy research agent. Conducts deep market intelligence across VC theses, competitive landscape, unit economics, and generates comprehensive Word documents with full references."
  default_prompt: "Research the given AI strategy topic using the ai-strategy-researcher skill. Execute the 4-phase research framework, run parallel WebSearch calls, generate a professional Word document with 13 sections and 30+ references."
policy:
  allow_implicit_invocation: true
  model: opus
  max_turns: 30
  permission_mode: acceptEdits
  skills:
    - ai-strategy-researcher
  allowed_tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - WebSearch
    - WebFetch
